<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/" (click)="fecharMenu()" aria-label="Ir para o início">
      <span class="brand-mark" aria-hidden="true">NF</span>
      <span>
        <strong>Sistema de Notas Fiscais</strong>
        <small>Korp Teste Técnico</small>
      </span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-label="Abrir navegação"
      [attr.aria-expanded]="menuAberto()"
      (click)="alternarMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" [class.main-nav-open]="menuAberto()" aria-label="Navegação principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="fecharMenu()"
      >
        Início
      </a>
      <a routerLink="/produtos" routerLinkActive="active" (click)="fecharMenu()">Produtos</a>
      <a routerLink="/notas-fiscais" routerLinkActive="active" (click)="fecharMenu()">Notas Fiscais</a>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
