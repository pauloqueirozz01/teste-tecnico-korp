<app-page-header
  titulo="Produtos"
  descricao="Gerencie os produtos disponíveis no estoque."
>
  <a page-action class="primary-action" routerLink="/produtos/novo">Novo produto</a>
</app-page-header>

@if (sucesso()) {
  <p class="success-message" role="status">{{ sucesso() }}</p>
}

@if (carregando()) {
  <app-loading mensagem="Carregando produtos..." />
} @else if (erro()) {
  <div class="state-stack">
    <app-error-message [mensagem]="erro()!" />
    <button type="button" class="secondary-action" (click)="carregarProdutos()">Tentar novamente</button>
  </div>
} @else if (produtos().length === 0) {
  <app-empty-state
    titulo="Nenhum produto cadastrado"
    descricao="Cadastre um produto para disponibilizar saldo ao processo de emissão."
  >
    <a class="secondary-action" routerLink="/produtos/novo">Cadastrar produto</a>
  </app-empty-state>
} @else {
  <app-product-table [produtos]="produtos()" />
}
