<app-page-header
  titulo="Novo produto"
  descricao="Cadastre produtos para disponibilizar saldo ao processo de emissão."
/>

@if (erro()) {
  <app-error-message [mensagem]="erro()!" />
}

<app-product-form [salvando]="salvando()" (salvar)="salvarProduto($event)">
  <a form-secondary-action routerLink="/produtos">Voltar</a>
</app-product-form>
