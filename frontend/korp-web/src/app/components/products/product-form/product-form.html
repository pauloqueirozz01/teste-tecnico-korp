<form class="product-form" [formGroup]="form" (ngSubmit)="submeter()">
  <div class="form-field">
    <label for="codigo">Código</label>
    <input
      id="codigo"
      type="text"
      formControlName="codigo"
      maxlength="50"
      autocomplete="off"
      [attr.aria-invalid]="campoInvalido('codigo')"
      aria-describedby="codigo-erro"
    />
    @if (campoInvalido('codigo')) {
      <p id="codigo-erro" class="field-error">{{ mensagemErro('codigo') }}</p>
    }
  </div>

  <div class="form-field">
    <label for="descricao">Descrição</label>
    <input
      id="descricao"
      type="text"
      formControlName="descricao"
      maxlength="200"
      autocomplete="off"
      [attr.aria-invalid]="campoInvalido('descricao')"
      aria-describedby="descricao-erro"
    />
    @if (campoInvalido('descricao')) {
      <p id="descricao-erro" class="field-error">{{ mensagemErro('descricao') }}</p>
    }
  </div>

  <div class="form-field compact">
    <label for="saldo">Saldo inicial</label>
    <input
      id="saldo"
      type="number"
      formControlName="saldo"
      min="0"
      inputmode="numeric"
      [attr.aria-invalid]="campoInvalido('saldo')"
      aria-describedby="saldo-erro"
    />
    @if (campoInvalido('saldo')) {
      <p id="saldo-erro" class="field-error">{{ mensagemErro('saldo') }}</p>
    }
  </div>

  <div class="form-actions">
    <button type="button" class="secondary-button" (click)="cancelar.emit()">Cancelar</button>
    <button type="submit" [disabled]="salvando()">
      {{ salvando() ? 'Cadastrando...' : 'Cadastrar produto' }}
    </button>
  </div>
</form>
